services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: multilivetv
      POSTGRES_PASSWORD: multilivetv
      POSTGRES_DB: multilivetv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multilivetv"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api-go
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://multilivetv:multilivetv@postgres:5432/multilivetv?sslmode=disable
      JWT_SECRET: change-me-in-production
      SOURCES_PATH: config/sources.json
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_CORS_ORIGIN: http://localhost:3001
    volumes:
      - ./apps/api-go/config/sources.json:/app/config/sources.json
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ./apps/admin
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  pgdata:
