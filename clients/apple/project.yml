name: MultiLiveTV
options:
  bundleIdPrefix: com.heibaimiao
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  # Xcode 16's objectVersion 77 drops CocoaPods native target dependencies, so
  # [CP] Copy XCFrameworks never runs and the linker cannot find TVVLCKit.
  projectFormat: xcode15_0
  postGenCommand: pod install
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  MultiLiveTV-iOS:
    type: application
    platform: iOS
    sources:
      - path: MultiLiveTV
        excludes:
          - "**/Info-*.plist"
          - "**/*.entitlements"
    resources:
      - path: MultiLiveTV/Resources
    settings:
      PRODUCT_NAME: MultiLiveTV
      PRODUCT_BUNDLE_IDENTIFIER: com.heibaimiao.multilivetv
      TARGETED_DEVICE_FAMILY: "2"
      INFOPLIST_FILE: MultiLiveTV/Info-iOS.plist
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
    preBuildScripts:
      - name: Copy VLCKit XCFramework slice
        path: scripts/copy-vlckit-slice.sh
        basedOnDependencyAnalysis: false
  MultiLiveTV-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: MultiLiveTV
        excludes:
          - "**/Info-*.plist"
          - "**/*.entitlements"
    resources:
      - path: MultiLiveTV/Resources
    settings:
      PRODUCT_NAME: MultiLiveTV
      PRODUCT_BUNDLE_IDENTIFIER: com.heibaimiao.multilivetv.tv
      INFOPLIST_FILE: MultiLiveTV/Info-tvOS.plist
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
      ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
    entitlements:
      path: MultiLiveTV/MultiLiveTV-tvOS.entitlements
    preBuildScripts:
      - name: Copy VLCKit XCFramework slice
        path: scripts/copy-vlckit-slice.sh
        basedOnDependencyAnalysis: false
    dependencies:
      - target: MultiLiveTVTopShelf
  MultiLiveTVTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: MultiLiveTVTopShelf
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: MultiLiveTV/Services/TopShelf
      - path: MultiLiveTV/Services/NetworkConfig.swift
    settings:
      PRODUCT_NAME: MultiLiveTVTopShelf
      PRODUCT_BUNDLE_IDENTIFIER: com.heibaimiao.multilivetv.tv.topshelf
      INFOPLIST_FILE: MultiLiveTVTopShelf/Info.plist
      CODE_SIGN_STYLE: Automatic
      SKIP_INSTALL: YES
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: MultiLiveTVTopShelf/MultiLiveTVTopShelf.entitlements
    dependencies:
      - sdk: TVServices.framework

schemes:
  MultiLiveTV-tvOS:
    build:
      targets:
        MultiLiveTV-tvOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MultiLiveTV-iOS:
    build:
      targets:
        MultiLiveTV-iOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
