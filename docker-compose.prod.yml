services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multilivetv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-multilivetv}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multilivetv}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api-go
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      GIN_MODE: release
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-multilivetv}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multilivetv}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SOURCES_PATH: config/sources.json
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_CORS_ORIGIN: ${ADMIN_CORS_ORIGIN:-http://localhost:3001}
    volumes:
      - ./apps/api-go/config/sources.json:/app/config/sources.json
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ./apps/admin
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3001}:80"
    depends_on:
      - api

volumes:
  pgdata:
