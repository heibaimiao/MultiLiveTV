services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multilivetv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-multilivetv}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multilivetv}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 生产不暴露 5432 到公网

  api:
    build: ./apps/api-go
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      GIN_MODE: release
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-multilivetv}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multilivetv}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SOURCES_PATH: config/sources.json
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
