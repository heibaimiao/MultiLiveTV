openapi: 3.0.3
info:
  title: MultiLiveTV API
  version: 1.0.0
  description: VOD aggregation API for Apple TV / iPad / Android clients
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
paths:
  /sources:
    get:
      summary: List enabled VOD sources
      tags: [VOD]
      responses:
        "200":
          description: OK
  /vod/list:
    get:
      summary: VOD list by category
      tags: [VOD]
      parameters:
        - name: sourceId
          in: query
          schema: { type: integer }
        - name: pg
          in: query
          schema: { type: integer, default: 1 }
        - name: t
          in: query
          description: Category type id (single-source)
          schema: { type: integer }
        - name: cat
          in: query
          description: Unified category slug (multi-source; takes precedence over t)
          schema: { type: string }
      responses:
        "200":
          description: OK
  /vod/detail:
    get:
      summary: Merged VOD detail with play sources
      tags: [VOD]
      parameters:
        - name: sourceId
          in: query
          required: true
          schema: { type: integer }
        - name: ids
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
  /vod/search:
    get:
      summary: Cross-source search with merge
      tags: [VOD]
      parameters:
        - name: wd
          in: query
          required: true
          schema: { type: string }
        - name: sourceId
          in: query
          schema: { type: integer }
        - name: pg
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: OK
  /vod/types:
    get:
      summary: Category list for a source
      tags: [VOD]
      parameters:
        - name: sourceId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: OK
  /vod/categories:
    get:
      summary: Unified cross-source category tree (slug based)
      tags: [VOD]
      responses:
        "200":
          description: OK
  /vod/pic:
    get:
      summary: Poster URL for a VOD
      tags: [VOD]
      parameters:
        - name: sourceId
          in: query
          required: true
          schema: { type: integer }
        - name: ids
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
  /play/parse:
    get:
      summary: Parse play URL via jx_url
      tags: [Play]
      parameters:
        - name: sourceId
          in: query
          required: true
          schema: { type: integer }
        - name: url
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
  /play/resolve:
    post:
      summary: Unified play resolve (direct MacCMS / ticket via bpz5)
      description: |
        Resolve a single selected play line. Clients should pick the preferred
        playable line from detail playSources (sorted by weight; skip ticket
        when ticket mode is disabled) then call this endpoint.
      tags: [Play]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [direct, ticket]
                sourceId: { type: integer }
                url: { type: string }
                jx: { type: boolean, default: true }
                ticket: { type: string }
                providerId: { type: string }
                playFrom: { type: string }
      responses:
        "200":
          description: Resolved playable URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  parsed: { type: boolean }
                  mode: { type: string }
                  playFrom: { type: string }
                  expiresAt:
                    type: integer
                    nullable: true
        "501":
          description: ticket mode disabled (BPZ5_HMAC_SECRET not set)
        "502":
          description: bpz5 upstream failure
  /auth/register:
    post:
      summary: Register user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        "201":
          description: Created
  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: OK
  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: OK
  /user/favorites:
    get:
      summary: List favorites
      tags: [User]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    post:
      summary: Add favorite
      tags: [User]
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
    delete:
      summary: Remove favorite
      tags: [User]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: merge_key
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
  /user/progress:
    get:
      summary: Get watch progress
      tags: [User]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
    put:
      summary: Update watch progress
      tags: [User]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
